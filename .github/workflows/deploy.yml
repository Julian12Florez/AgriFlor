name: Deploy AgriFlor

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Que desplegar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend

jobs:
  # -----------------------------------------------------------
  # Detectar que cambio para decidir que desplegar
  # -----------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.deploy_target }}"
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "frontend" ]; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "backend" ]; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi
          else
            # Auto-detect from changed files
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            if echo "$CHANGED" | grep -q "^frontend/"; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi
            if echo "$CHANGED" | grep -q "^backend/"; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Summary
        run: |
          echo "### Deploy Detection" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ steps.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ steps.changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # Deploy Frontend a Cloudflare Pages
  # -----------------------------------------------------------
  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://agriflor-api.duckdns.org/api
        run: npx vite build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name agriflor --branch main

  # -----------------------------------------------------------
  # Deploy Backend al VPS Hetzner via SSH
  # -----------------------------------------------------------
  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/agriflor/repo
            git fetch origin main
            git reset --hard origin/main
            cd /opt/agriflor
            docker compose build backend
            docker compose up -d backend
            # Esperar a que el contenedor termine de arrancar. start.sh ya corre
            # 'migrate' al boot; esperar a que /up responda evita la race condition
            # de dos 'migrate' concurrentes (boot vs deploy) que marcaba el job en rojo.
            echo "Esperando a que el backend arranque..."
            for i in $(seq 1 40); do
              if curl -sf -o /dev/null https://agriflor-api.duckdns.org/up; then
                echo "Backend arriba (intento $i)"; break
              fi
              sleep 3
            done
            # Migración idempotente: si start.sh ya migró, esto reporta "Nothing to migrate".
            docker exec agriflor-backend php artisan migrate --force
            docker exec agriflor-backend php artisan config:cache
            docker exec agriflor-backend php artisan route:cache
            echo "Deploy OK"

      - name: Summary
        run: |
          echo "### Backend Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ secrets.VPS_HOST }} (Hetzner Cloud cpx21)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://agriflor-api.duckdns.org" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # Verificacion post-deploy
  # -----------------------------------------------------------
  verify:
    needs: [deploy-frontend, deploy-backend]
    if: always() && (needs.deploy-frontend.result == 'success' || needs.deploy-backend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Frontend
        if: needs.deploy-frontend.result == 'success'
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://agriflor.pages.dev)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Frontend OK ($HTTP_CODE)"
          else
            echo "Frontend FAILED ($HTTP_CODE)"
            exit 1
          fi

      - name: Verify Backend
        if: needs.deploy-backend.result == 'success'
        run: |
          # Wait for potential cold start
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://agriflor-api.duckdns.org/up)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Backend OK ($HTTP_CODE)"
          else
            echo "Backend FAILED ($HTTP_CODE)"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://agriflor.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: https://agriflor-api.duckdns.org" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Verified" >> $GITHUB_STEP_SUMMARY

services:
  # PHP/Laravel Application
  app:
    build:
      args:
        user: agriflor
        uid: 1000
      context: .
      dockerfile: Dockerfile.dev
    image: agriflor-app
    container_name: agriflor-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - agriflor
    depends_on:
      - mysql
      - redis
      - mailhog

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: agriflor-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - agriflor
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: agriflor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agriflor}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-agriflor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - agriflor
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: agriflor-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - agriflor

  # MailHog (servidor SMTP local para desarrollo)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: agriflor-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - agriflor

  # phpMyAdmin (opcional, para gestión de BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: agriflor-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-agriflor}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 100M
    ports:
      - "8083:80"
    networks:
      - agriflor
    depends_on:
      - mysql

networks:
  agriflor:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
